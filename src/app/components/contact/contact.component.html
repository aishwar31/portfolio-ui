<div class="row">
    <div class="col-md-6 offset-md-3">
        <h2>Contact Me</h2>
        <form #contactForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" required [(ngModel)]="contact.name" name="name">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required [(ngModel)]="contact.email" name="email">
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required [(ngModel)]="contact.message"
                    name="message"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
